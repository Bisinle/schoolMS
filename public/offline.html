<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're Offline - SchoolMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0b1a34 0%, #1a2f5a 100%);
            padding: 1rem;
        }
        .card { max-width: 28rem; text-align: center; color: white; }
        h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 1rem; }
        p { color: #d1d5db; margin-bottom: 2rem; }
        button {
            padding: 0.75rem 1.5rem;
            background: white;
            color: #0b1a34;
            font-weight: 600;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're Offline</h1>
        <p>Check your internet connection and try again.</p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
